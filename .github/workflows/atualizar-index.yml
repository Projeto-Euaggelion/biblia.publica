name: Atualizar docs/index.json

on:
  push:
    branches: [main]
    paths:
      - "versoes/**/meta.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar docs/index.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/gerar_index.py

      - name: Commit e push, se houver mudanças
        run: |
          if git diff --quiet -- docs/index.json; then
            echo "Nenhuma mudança em docs/index.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.json
          git commit -m "chore: atualiza docs/index.json automaticamente"
          git push
