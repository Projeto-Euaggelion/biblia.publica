name: Validar estrutura das versões

on:
  pull_request:
    paths:
      - "versoes/**"

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Rodar validar_estrutura.py
        run: python scripts/validar_estrutura.py
