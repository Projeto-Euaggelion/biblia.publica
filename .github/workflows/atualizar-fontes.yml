name: Atualizar docs/texto-biblico/fontes.md

on:
  push:
    branches: [main]
    paths:
      - "versoes/**/LICENSE.md"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar-fontes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar docs/texto-biblico/fontes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/gerar_fontes.py

      - name: Commit e push, se houver mudanças
        run: |
          if git diff --quiet -- docs/texto-biblico/fontes.md; then
            echo "Nenhuma mudança em docs/texto-biblico/fontes.md."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/texto-biblico/fontes.md
          git commit -m "chore: atualiza docs/texto-biblico/fontes.md automaticamente"
          git push
